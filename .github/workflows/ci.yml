name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: aoheyra/aoIdents-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  style:
    if: github.event.action != 'closed'
    name: Style
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check

  clippy:
    if: github.event.action != 'closed'
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    if: github.event.action != 'closed'
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  tests:
    if: github.event.action != 'closed'
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: test default features
        run: cargo test
      - name: test all features
        run: cargo test --all-features

  msrv:
    if: github.event.action != 'closed'
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust MSRV
        uses: dtolnay/rust-toolchain@1.85
      - name: build default features
        run: cargo build
      - name: build all features
        run: cargo build --all-features

  deny:
    if: github.event.action != 'closed'
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    if: github.event.action != 'closed'
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      # Library crates do not commit Cargo.lock (generated file), so resolve
      # one here; cargo-audit audits the resolved dependency graph.
      - name: generate lockfile
        run: cargo generate-lockfile
      - name: install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  package:
    if: github.event.action != 'closed'
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo package
        run: cargo package
