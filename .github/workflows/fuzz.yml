name: fuzz

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Total libFuzzer seconds, split across all targets
        required: false
        default: '5400'
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz (90 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install nightly with sanitizer support
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview, rust-src

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: run every target for its share of the budget
        run: |
          set -euo pipefail
          total='${{ inputs.duration_seconds || '5400' }}'
          mapfile -t targets < <(find fuzz/fuzz_targets -maxdepth 1 -name '*.rs' -printf '%f\n' | sed 's/\.rs$//' | sort)
          n=${#targets[@]}
          if [ "$n" -eq 0 ]; then
            echo 'no fuzz targets found' >&2
            exit 1
          fi
          base=$((total / n))
          remainder=$((total % n))
          for i in "${!targets[@]}"; do
            name=${targets[$i]}
            per=$base
            if [ "$i" -lt "$remainder" ]; then
              per=$((per + 1))
            fi
            echo "== $name (${per}s)"
            mkdir -p "fuzz/corpus/$name"
            if [ -d "fuzz/seeds/$name" ]; then
              cargo +nightly fuzz run "$name" "fuzz/corpus/$name" "fuzz/seeds/$name" -- \
                -max_total_time="$per" \
                -rss_limit_mb=2048 \
                -timeout=10 \
                -max_len=16384
            else
              cargo +nightly fuzz run "$name" "fuzz/corpus/$name" -- \
                -max_total_time="$per" \
                -rss_limit_mb=2048 \
                -timeout=10 \
                -max_len=16384
            fi
          done

      - name: upload crashes and corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
