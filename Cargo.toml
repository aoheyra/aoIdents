[package]
name = "ao_idents"
version = "0.1.0"
edition = "2024"
# MSRV: edition 2024 requires Rust 1.85+. Bump deliberately, never silently.
rust-version = "1.85"
description = "Identity, trust and cryptography for the aoheyra mesh: node keys, signatures, sealed messages, rotating tags, contacts and replay guard (pure Rust, no I/O)"
repository = "https://github.com/aoheyra/aoIdents"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["cryptography", "identity", "mesh", "signatures"]
categories = ["cryptography"]

[dependencies]
blake3 = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
hkdf = "0.12"
rand_core = "0.6"
sha2 = "0.10"
# ADR-0001 vetted list: constant-time comparisons and secret zeroization.
subtle = "2.6"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = "1.8"
# Argon2id for the passphrase-encrypted backup (IDN-06); RustCrypto,
# MIT OR Apache-2.0. 0.5.x, not 0.6: 0.6 pulls blake2 -> digest ->
# ctutils, whose constant-time fix needs Rust 1.87 (above this
# crate's MSRV) and so fails cargo-deny's advisory gate. `zeroize`
# wipes the internal state; no PHC-string or getrandom features.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }

[dev-dependencies]
proptest = "1"
