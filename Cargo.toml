[package]
name = "ao_idents"
version = "0.1.0"
edition = "2024"
# MSRV: edition 2024 requires Rust 1.85+. Bump deliberately, never silently.
rust-version = "1.85"
description = "Identity, trust and cryptography for the aoheyra mesh: node keys, signatures, sealed messages, rotating tags, contacts and replay guard (pure Rust, no I/O)"
repository = "https://github.com/aoheyra/aoIdents"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["cryptography", "identity", "mesh", "signatures"]
categories = ["cryptography"]

[dependencies]
blake3 = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
hkdf = "0.12"
rand_core = "0.6"
sha2 = "0.10"
# ADR-0001 vetted list: constant-time comparisons and secret zeroization.
subtle = "2.6"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = "1.8"

[dev-dependencies]
proptest = "1"
