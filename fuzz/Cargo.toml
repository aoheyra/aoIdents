[package]
name = "ao_idents-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Same version as the library; the handshake target needs an injected
# RNG and the fuzz crate cannot reach the tests' copy of it.
rand_core = "0.6"

[dependencies.ao_idents]
path = ".."

[workspace]
members = ["."]

[[bin]]
name = "seal_decode_open"
path = "fuzz_targets/seal_decode_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "card_decode"
path = "fuzz_targets/card_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_decode"
path = "fuzz_targets/signed_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "group_decode"
path = "fuzz_targets/group_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "prekey_decode"
path = "fuzz_targets/prekey_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake_read"
path = "fuzz_targets/handshake_read.rs"
test = false
doc = false
bench = false
